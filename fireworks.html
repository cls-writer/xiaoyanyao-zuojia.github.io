<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="烟花观赏区：点击按钮发射烟花，可随时停止。">
    <link rel="icon" href="data:,">
    <title>烟花观赏区</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: '微软雅黑', sans-serif;
            overflow: hidden;
        }

        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;          /* 修复：画布不拦截上层控件点击 */
            z-index: 0;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            z-index: 1000;
            text-align: center;
            -webkit-backdrop-filter: blur(10px);   /* 修复：补 Safari 前缀 */
            backdrop-filter: blur(10px);
            border: 2px solid #3498db;
        }

        .title { font-size: 24px; margin-bottom: 10px; color: #3498db; }
        .subtitle { font-size: 14px; color: #aaa; margin-bottom: 15px; }

        .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        button {
            background: linear-gradient(145deg, #3498db, #2c3e50);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4); }
        button:focus-visible { outline: 3px solid #f1c40f; outline-offset: 2px; }
        .back-btn { background: linear-gradient(145deg, #e74c3c, #c0392b); }

        .fireworks-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(106, 17, 203, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            white-space: pre-wrap;         /* 修复：textContent 下仍保留换行 */
            width: max-content;            /* 修复：left:50% 的 shrink-to-fit 会把宽度压到 50% 视口，导致贺词折行 */
            max-width: 90vw;
            box-sizing: border-box;
            z-index: 999;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            animation: pulse 2s infinite;
            display: none;
        }

        @keyframes pulse {
            0%   { transform: translate(-50%, -50%) scale(1); }
            50%  { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* 修复：尊重系统的「减少动态效果」设置 */
        @media (prefers-reduced-motion: reduce) {
            .fireworks-message { animation: none; }
            button { transition: none; }
            button:hover { transform: none; }
        }

        .noscript-tip {
            position: fixed; inset: 0; display: grid; place-items: center;
            color: #fff; font-size: 18px; background: #111; z-index: 2000;
        }
    </style>
</head>
<body>
    <div class="control-panel">
        <div class="title">🎆 烟花观赏区</div>
        <div class="subtitle">点击下方按钮开始放烟花</div>
        <div class="buttons">
            <button type="button" data-action="start" aria-label="发射烟花">发射烟花</button>
            <button type="button" data-action="stop" aria-label="停止烟花">停止烟花</button>
            <button type="button" data-action="home" class="back-btn" aria-label="返回主站">🏠返回主站</button>
        </div>
    </div>

    <canvas id="fireworksCanvas" aria-hidden="true"></canvas>
    <div class="fireworks-message" id="fireworksMessage" role="status" aria-live="polite"></div>

    <noscript><div class="noscript-tip">本页面的烟花效果需要 JavaScript，请在浏览器设置中启用后重试。</div></noscript>

    <script>
    'use strict';

    /* ============================================================
       修复参考版（对应审计报告 F-01 ~ F-14）
       改动摘要：
       1. start 幂等 + stop 统一收口，杜绝多个 rAF 循环叠加
       2. 火箭上升速度设下限，保证一定能到达 targetY；兜底清理僵尸对象
       3. showMessage 用 textContent 写入，消除 innerHTML 型 DOM XSS
       4. 消息定时器可取消，消除多次调用的隐藏竞态
       5. canvas 按 devicePixelRatio 设置位图，修复高 DPI 模糊
       6. resize 时按比例缩放已有粒子坐标，并同步 setTransform
       7. 尊重 prefers-reduced-motion、补 noscript / aria / focus-visible
       8. 移除内联 onclick，改用 addEventListener（兼容严格 CSP）
       9. 所有绘制统一使用 CSS 像素坐标系
       10. getContext 判空；首页地址与贺词抽成可配置常量
       ============================================================ */

    // ---- 可配置项：部署前请核对 ----
    const HOME_URL = 'index.html';   // 必须与主站实际文件名一致；否则返回按钮 404
    // 主站载明社团成立于 2024 年 11 月，截至 2026 年 11 月应为「二周年」，
    // 原页写「一周年」与主站「二周年贺图正在创作」冲突，请按事实核定。
    const CELEBRATION_TEXT = '🎉 热烈庆贺作协网站诞生二周年！ 🎉';
    const MAX_DPR = 2;               // 限制倍率，避免超大屏位图过大

    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    const messageElement = document.getElementById('fireworksMessage');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!ctx) {
        messageElement.textContent = '当前浏览器不支持 Canvas 2D，无法播放烟花。';
        messageElement.style.display = 'block';
        messageElement.style.animation = 'none';
    }

    let viewW = 0, viewH = 0, dpr = 1;
    let fireworks = [];
    let animationId = null;
    let messageTimer = null;
    let running = false;

    function setupCanvas() {
        if (!ctx) return;
        const prevW = viewW, prevH = viewH;
        viewW = window.innerWidth;
        viewH = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);

        // 位图按物理像素设置，绘制坐标系缩放回 CSS 像素
        canvas.width = Math.round(viewW * dpr);
        canvas.height = Math.round(viewH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // 设置 width/height 会清空画布；把已有对象按比例缩放，避免飞出视口
        if (prevW && prevH && (prevW !== viewW || prevH !== viewH)) {
            const sx = viewW / prevW, sy = viewH / prevH;
            fireworks.forEach(f => {
                f.x *= sx; f.y *= sy; f.targetY *= sy;
                f.particles.forEach(p => { p.x *= sx; p.y *= sy; });
            });
        }
    }

    class Particle {
        constructor(x, y, color, velocity) {
            this.x = x; this.y = y; this.color = color; this.velocity = velocity;
            this.alpha = 1;
            this.decay = Math.random() * 0.02 + 0.01;
            this.size = Math.random() * 2 + 1;
        }
        update() {
            this.velocity.x *= 0.99;
            this.velocity.y *= 0.99;
            this.velocity.y += 0.05;
            this.x += this.velocity.x;
            this.y += this.velocity.y;
            this.alpha -= this.decay;
            return this.alpha > 0;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(this.alpha, 0);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    class Firework {
        constructor(x, y, targetY, color) {
            this.x = x; this.y = y; this.targetY = targetY; this.color = color;
            this.velocity = { x: 0, y: -8 };
            this.particles = [];
            this.exploded = false;
        }
        update() {
            if (!this.exploded) {
                // 修复：原实现 v *= 0.99 使总上升位移上限约 800px，
                // 高视口 + 低 targetY 时永远到不了目标，且永不被清理。
                // 给上升速度设 -2px/帧 下限，保证必然到达 targetY。
                this.velocity.y = Math.min(this.velocity.y * 0.99, -2);
                this.y += this.velocity.y;
                if (this.y <= this.targetY) this.explode();
            }
            this.particles = this.particles.filter(p => p.update());
        }
        explode() {
            this.exploded = true;
            const colors = [this.color, '#ffffff', '#ffff00'];
            const count = reduceMotion ? 24 : 100;   // 减少动态效果时降低密度
            for (let i = 0; i < count; i++) {
                const velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                const color = colors[Math.floor(Math.random() * colors.length)];
                this.particles.push(new Particle(this.x, this.y, color, velocity));
            }
        }
        draw() {
            if (!this.exploded) {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            this.particles.forEach(p => p.draw());
        }
    }

    function createFirework() {
        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        fireworks.push(new Firework(Math.random() * viewW, viewH, Math.random() * (viewH / 2), color));
    }

    function animate() {
        if (!running) return;                       // 双保险：stop 后不再自调度
        ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
        ctx.fillRect(0, 0, viewW, viewH);

        if (Math.random() < 0.05) createFirework();

        fireworks.forEach(f => { f.update(); f.draw(); });

        for (let i = fireworks.length - 1; i >= 0; i--) {
            const f = fireworks[i];
            // 兜底：飞出屏幕上方的未爆炸对象也要清理
            if ((f.exploded && f.particles.length === 0) || f.y < -50) {
                fireworks.splice(i, 1);
            }
        }
        animationId = requestAnimationFrame(animate);
    }

    function showMessage(text = CELEBRATION_TEXT) {
        if (!messageElement) return;
        messageElement.textContent = text;          // 修复：不再用 innerHTML
        messageElement.style.display = 'block';
        if (messageTimer) clearTimeout(messageTimer);   // 修复：避免多个定时器互相提前隐藏
        messageTimer = setTimeout(() => {
            messageElement.style.display = 'none';
            messageTimer = null;
        }, 2000);
    }

    function startFireworks() {
        if (!ctx || running) return;                // 修复：幂等，连点不会叠加循环
        setupCanvas();
        running = true;
        showMessage();
        if (!reduceMotion) animate();               // 减少动态效果时只显示贺词，不播放动画
        else { running = false; }
    }

    function stopFireworks() {
        running = false;
        if (animationId !== null) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        fireworks = [];
        if (messageTimer) { clearTimeout(messageTimer); messageTimer = null; }
        if (messageElement) messageElement.style.display = 'none';
        if (ctx) {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, viewW, viewH);
        }
    }

    // 修复：移除内联 onclick，兼容 Content-Security-Policy（无需 unsafe-inline）
    document.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
            const a = btn.dataset.action;
            if (a === 'start') startFireworks();
            else if (a === 'stop') stopFireworks();
            else if (a === 'home') location.href = HOME_URL;
        });
    });

    window.addEventListener('load', () => {
        setupCanvas();
        window.addEventListener('resize', setupCanvas, { passive: true });
    });

    // 保留与原页相同的全局契约，供主站调用
    window.startFireworks = startFireworks;
    window.stopFireworks = stopFireworks;
    </script>
</body>
</html>
